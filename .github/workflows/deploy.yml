name: Build and push to Alibaba Cloud ACR

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: champions-acr
  cancel-in-progress: true

env:
  ACR_REGISTRY: crpi-o4dxcodfda9a23uu.cn-shanghai.personal.cr.aliyuncs.com
  ACR_IMAGE: crpi-o4dxcodfda9a23uu.cn-shanghai.personal.cr.aliyuncs.com/nanamitouko/champions-lab

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run application checks
        run: |
          python -m pip install -r server/requirements.txt
          python -m unittest discover -s server -p 'test_*.py' -v
          node --check dist/app.js

  build_and_push:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build and update the latest image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.ACR_IMAGE }}:latest

services:
  champions:
    build:
      context: .
    container_name: champions-local
    ports:
      - "127.0.0.1:4173:8000"
    environment:
      DATABASE_PATH: /data/champions.sqlite3
      SPRITE_DIR: /data/sprites
      AUTO_REFRESH: "1"
    volumes:
      - champions_data:/data
    restart: unless-stopped

volumes:
  champions_data:
